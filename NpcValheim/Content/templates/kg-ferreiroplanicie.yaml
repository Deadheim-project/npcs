# Importado do KG Marketplace: Traders/TraderProfiles.cfg [FerreiroPlanicie]
# Sem 'name': aplicar este modelo troca a lista de precos e deixa o
# nome do NPC como esta.
#
# Mercador de bioma (A3, 14/10/2026): Planície, trancado pelo passe de Moder (Dragon), igual à
# Loja da Planície do Mestre dos Passes. Preços em Deadcoins, limite semanal e Garantia/Portal
# Token são proposta; o admin pode ajustar tudo no jogo (Admin > Balcão).
name: ""
forType: Marketplace
marketplace:
  taxPercent: 0
  requiredBoss: "Dragon"
  buys: []
  sells:
    - itemName: "BlackMetalScrap"
      price: 350
    - itemName: "Needle"
      price: 10
    - itemName: "Tar"
      price: 50
    - itemName: "GarantiaRefino"
      price: 1000
      deadcoins: 30
      weeklyLimit: 10
    - itemName: "PortalToken"
      price: 3000
