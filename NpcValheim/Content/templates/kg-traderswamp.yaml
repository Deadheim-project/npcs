# Importado do KG Marketplace: Traders/TraderProfiles.cfg [TraderSwamp]
# Sem 'name': aplicar este modelo troca a lista de precos e deixa o
# nome do NPC como esta.
#
# Mercador de bioma (A3, 14/10/2026): Pântano, trancado pelo passe do Ancião (gd_king), igual à
# Loja do Pântano do Mestre dos Passes. Preços em Deadcoins, limite semanal e Garantia/Portal
# Token são proposta; o admin pode ajustar tudo no jogo (Admin > Balcão).
name: ""
forType: Marketplace
marketplace:
  taxPercent: 0
  requiredBoss: "gd_king"
  buys: []
  sells:
    - itemName: "ArrowIron"
      price: 2
    - itemName: "Root"
      price: 150
    - itemName: "ElderBark"
      price: 2
    - itemName: "GarantiaRefino"
      price: 1000
      deadcoins: 30
      weeklyLimit: 10
    - itemName: "PortalToken"
      price: 3000
